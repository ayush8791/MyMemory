name: Release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing (only if the keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret: publishing a debug-signed pre-release. Gmail sign-in needs a stable signing key, see README."
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TASK=assembleRelease
          [ "$SIGNED" = "true" ] || TASK=assembleDebug
          ./gradlew :app:testDebugUnitTest ":app:$TASK" -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Collect files
        run: |
          mkdir dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/MyMemory-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/*.apk "dist/MyMemory-${GITHUB_REF_NAME}-debug.apk"
          fi
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--generate-notes"
          # 0.x versions and unsigned builds are marked as pre-releases.
          if [ "$SIGNED" != "true" ] || [[ "$GITHUB_REF_NAME" == v0.* ]] || [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "MyMemory ${GITHUB_REF_NAME}" $FLAGS
